<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <title>原生 Web Components · 库存编辑</title>
</head>
<body>
  <main>
    <h1 tabindex="-1">原生 Web Components · 库存编辑</h1>
    <p>保留原生列表与筛选；本课只连接库存输入和按钮。刷新恢复固定数据。</p>
    <div class="toolbar">
      <label>名称或编号 <input id="search" type="search" placeholder="名称或编号"></label>
      <label>组件主题 <select id="theme"><option value="sap_horizon">Horizon 浅色</option><option value="sap_horizon_dark">Horizon 深色</option></select></label>
      <label>组件语言 <select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
    </div>
    <p id="settings" role="status">组件入口等待连接</p>
    <p id="summary" role="status"></p>
    <section id="list" aria-label="库存列表"></section>
    <section id="editor" aria-labelledby="editor-title" hidden>
      <!-- 在这里加入本课的输入与按钮；列表外壳不需要重写。 -->
    </section>
    <p id="notice" role="status">编辑表单等待连接</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
