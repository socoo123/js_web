<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auto-fill 商品网格</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="grid.css">
  <link rel="icon" href="data:,">
</head>
<body><main>
<h1>auto-fill 商品网格</h1>
<label><input id="only-one" type="checkbox" style="width:auto"> 只显示 P001</label>
<ul id="auto-grid">
  <li class="product"><strong>P001 机械键盘</strong><p>外设 · 12 件 · ¥399.00</p><button type="button">编辑库存</button></li>
  <li class="product"><strong>P002 无线鼠标</strong><p>外设 · 0 件 · ¥129.00</p><button type="button">编辑库存</button></li>
  <li class="product"><strong>P003 27 英寸显示器</strong><p>显示器 · 7 件 · ¥1599.00</p><button type="button">编辑库存</button></li>
  <li class="product"><strong>P004 USB-C 扩展坞</strong><p>配件 · 3 件 · ¥299.00</p><button type="button">编辑库存</button></li>
  <li class="product"><strong>P005 显示器支架</strong><p>配件 · 25 件 · ¥199.00</p><button type="button">编辑库存</button></li>
  <li class="product"><strong>P006 降噪耳机</strong><p>音频 · 5 件 · ¥899.00</p><button type="button">编辑库存</button></li>
</ul>
<script>
document.querySelector("#only-one").addEventListener("change", event => {
  document.querySelectorAll("#auto-grid li").forEach((card, index) => {
    card.hidden = event.target.checked && index > 0;
  });
});
</script>
</main></body>
</html>
