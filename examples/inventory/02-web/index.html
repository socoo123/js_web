<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>原生库存页 · 阶段 2</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1>库存管理</h1>
    <p>保存库存会写入当前浏览器的本地副本；刷新可恢复，其他浏览器和设备各自独立。</p>
    <p id="data-source" role="status"></p>
    <section class="panel" aria-labelledby="backup-title">
      <h2 id="backup-title">本地副本与备份</h2>
      <div class="backup-actions">
        <button id="export" type="button">导出 JSON</button>
        <div class="field">
          <label for="import">导入 JSON（替换全部商品）</label>
          <input id="import" type="file" accept=".json,application/json" aria-describedby="backup-help">
        </div>
        <button id="reset" type="button">恢复初始数据</button>
      </div>
      <p id="backup-help">使用本页导出的 version 1 文件。导入前会确认，失败时保留原数据。</p>
      <p id="storage-feedback" role="status"></p>
    </section>
    <section class="panel" aria-labelledby="filters-title">
      <h2 id="filters-title">查找商品</h2>
      <div class="toolbar">
        <div class="field">
          <label for="search">商品名称或编号</label>
          <input id="search" type="search" autocomplete="off">
        </div>
        <div class="field field--category">
          <label for="category">分类</label>
          <select id="category">
            <option value="">全部</option><option>外设</option><option>显示器</option><option>配件</option><option>音频</option>
          </select>
        </div>
      </div>
    </section>
    <p id="summary"></p>
    <p id="result-count" role="status"></p>
    <button id="retry" type="button" hidden>重试加载</button>
    <ul id="products" aria-label="商品列表"></ul>
    <section class="panel" id="editor" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title">编辑库存</h2>
      <p id="editing-name"></p>
      <form id="stock-form">
        <label for="stock">库存件数</label>
        <input id="stock" name="stock" type="number" required min="0" max="99999" step="1" aria-describedby="stock-help stock-error">
        <p id="stock-help">请输入 0–99999 的整数，0 表示售罄。</p>
        <p id="stock-error" class="error" aria-live="polite"></p>
        <button type="submit">保存库存</button>
        <button id="cancel" type="button">取消</button>
      </form>
    </section>
    <p id="feedback" role="status"></p>
    <noscript><p>请启用 JavaScript 以使用库存筛选和编辑。</p></noscript>
  </main>
</body>
</html>
